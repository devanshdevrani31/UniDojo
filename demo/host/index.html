<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniDojo — localhost demo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥋</text></svg>">
<style>
  :root {
    --bg: #101116; --panel: #17181f; --line: #2a2c38;
    --fg: #eceef2; --muted: #9aa0b0; --accent: #6366f1; --accent2: #a5b4fc;
    --good: #34d399; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--fg); }
  a { color: var(--accent2); }
  header.site { display: flex; align-items: center; gap: 10px; padding: 14px 24px;
                border-bottom: 1px solid var(--line); background: #14151b;
                position: sticky; top: 0; z-index: 5; }
  header.site .logo { font-weight: 800; font-size: 18px; letter-spacing: .02em; color: var(--fg); text-decoration: none; }
  header.site .logo span { color: var(--accent2); }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
          color: var(--muted); white-space: nowrap; }
  .pill.live { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .pill.warn { color: #fbbf24; border-color: color-mix(in srgb, #fbbf24 40%, transparent); }
  .pusher { flex: 1; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 24px 80px; }
  main.wide { max-width: 1240px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2.sect { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
  .muted { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 20px; margin: 16px 0; }
  .gamecard { display: flex; gap: 16px; align-items: center; }
  .gamecard .thumb { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center;
                     font-size: 26px; background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .gamecard h3 { margin: 0 0 4px; font-size: 17px; }
  .gamecard p { margin: 0; font-size: 13px; color: var(--muted); max-width: 60ch; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button, .btn { font: inherit; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--line);
                 background: transparent; color: var(--fg); cursor: pointer; text-decoration: none;
                 display: inline-block; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:hover:not(:disabled), .btn:hover { border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, #fff); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .stagewrap { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
               background: #1b1c24; }
  iframe.game { width: 100%; border: 0; display: block; background: #1b1c24; }
  .hud { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line);
         background: var(--panel); font-size: 13px; color: var(--muted); }
  .track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 120px; }
  .track > i { display: block; height: 100%; width: 0; background: var(--good); transition: width .25s; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(16,17,22,.92);
             text-align: center; padding: 24px; z-index: 3; }
  .overlay h2 { margin: 0 0 6px; }
  table.lb { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  table.lb th, table.lb td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  table.lb th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .score-big { font-size: 40px; font-weight: 800; color: var(--good); margin: 8px 0; }
  .error { color: var(--bad); }
  code { background: #22232c; border-radius: 6px; padding: 1px 6px; font-size: 13px; }
  .back { font-size: 13px; }
  .proto { font-size: 12px; color: var(--muted); }
  .proto b { color: var(--accent2); font-weight: 600; }
  [hidden] { display: none !important; }

  /* --- creator view --- */
  .grid2 { display: grid; grid-template-columns: 330px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } }
  .dz { border: 2px dashed var(--line); border-radius: 14px; padding: 26px 16px; text-align: center;
        color: var(--muted); font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s; }
  .dz.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--fg); }
  .src { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-top: 6px;
         border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .src .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src .sz { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .src button.x { padding: 2px 8px; font-size: 12px; border-radius: 8px; }
  .src .err { color: var(--bad); font-size: 12px; }
  .optgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .opt input { position: absolute; opacity: 0; }
  .opt label { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 12px;
               cursor: pointer; transition: border-color .12s, background .12s; height: 100%; }
  .opt label:hover { border-color: var(--accent); }
  .opt input:checked + label { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .opt .t { font-weight: 700; font-size: 14px; }
  .opt .b { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .opt { position: relative; }
  .swatches { display: flex; gap: 4px; margin: 8px 0 4px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); }
  .themedot { width: 100%; height: 34px; border-radius: 9px; margin-bottom: 8px; overflow: hidden; display: flex; }
  .themedot i { flex: 1; }
  label.field { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=date], textarea, select {
    width: 100%; font: inherit; color: var(--fg); background: #12131a; border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 12px; }
  input:focus-visible, textarea:focus-visible { outline: 1px solid var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .badge { font-size: 12px; color: var(--accent2); font-weight: 700; min-width: 56px; text-align: right; }
  .stagerow { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 14px; color: var(--muted); }
  .stagerow.on { color: var(--fg); }
  .stagerow.done { color: var(--good); }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
  .stagerow.on .dot { border-color: var(--accent); background: var(--accent); animation: pulse 1.1s infinite ease-in-out; }
  .stagerow.done .dot { border-color: var(--good); background: var(--good); }
  @keyframes pulse { 50% { opacity: .35; } }
  pre.tail { background: #0c0d12; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
             font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); height: 130px;
             overflow-y: auto; white-space: pre-wrap; word-break: break-word; margin: 12px 0 0; }
  details.paste { margin-top: 14px; }
  details.paste summary { cursor: pointer; color: var(--accent2); font-size: 13px; }
  .examline { font-size: 13px; color: var(--accent2); margin: 8px 0; min-height: 1.4em; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: min(420px, 92vw); }
</style>

<header class="site">
  <a class="logo" href="#/">🥋 Uni<span>Dojo</span></a>
  <span class="pill live">localhost demo</span>
  <span class="pusher"></span>
  <button id="profileChip" title="Your profile — stored in this browser"></button>
  <a class="btn primary" href="#/create" style="padding:7px 14px">+ Build a game</a>
  <span class="pill" id="origin-pill" title="Host and games run on different origins, like production"></span>
</header>
<main id="view"><p class="muted">Loading…</p></main>

<dialog id="profileDlg">
  <h2 class="sect" style="font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg)">Your profile</h2>
  <label class="field">Display name</label>
  <input type="text" id="pName" placeholder="Demo Student">
  <div class="frow">
    <div><label class="field">University</label><input type="text" id="pUni" placeholder="My University"></div>
    <div><label class="field">Course</label><input type="text" id="pCourse" placeholder="BIO101"></div>
  </div>
  <label class="field">Exam date — sets your pacing (everyone's exam is a different day)</label>
  <input type="date" id="pExam">
  <div class="row" style="margin-top:16px;justify-content:flex-end">
    <button onclick="profileDlg.close()">Done</button>
  </div>
</dialog>

<script>
'use strict';
const SANDBOX_ORIGIN = 'http://127.0.0.1:4174';
const PROTOCOL_VERSION = 1;

/* ---------- storage helpers ---------- */
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const PROFILE_KEY = 'unidojo-demo:profile';       // {displayName, examDate, university, course}
const OPTIONS_KEY = 'unidojo-demo:createOptions'; // {uiType, theme, items, minutes}
const readProfile = () => ({ displayName: 'Demo Student', examDate: null, university: '', course: '', ...(readJSON(PROFILE_KEY) || {}) });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysToExam = d => d ? Math.ceil((new Date(d) - new Date(new Date().toDateString())) / 864e5) : null;

document.getElementById('origin-pill').textContent =
  `host ${location.host} · sandbox ${new URL(SANDBOX_ORIGIN).host}`;

const post = (frame, type, payload) =>
  frame.contentWindow?.postMessage({ v: PROTOCOL_VERSION, type, payload }, SANDBOX_ORIGIN);

const saveKey = (slug, mode) => `unidojo-demo:save:${slug}:${mode}`;
const lbKey = (slug, mode) => `unidojo-demo:lb:${slug}:${mode}`;

/* ---------- profile ---------- */
const profileDlg = document.getElementById('profileDlg');
function syncProfile(chipOnly) {
  const p = readProfile();
  const days = daysToExam(p.examDate);
  document.getElementById('profileChip').textContent =
    `👤 ${p.displayName}${days != null ? ` · 📅 ${days}d to exam` : ''}`;
  if (chipOnly) return;
  pName.value = p.displayName === 'Demo Student' ? '' : p.displayName;
  pUni.value = p.university; pCourse.value = p.course;
  pExam.value = p.examDate || '';
}
function saveProfileFromInputs() {
  const p = {
    displayName: pName.value.trim() || 'Demo Student',
    university: pUni.value.trim(), course: pCourse.value.trim(),
    examDate: pExam.value || null,
  };
  writeJSON(PROFILE_KEY, p);
  syncProfile(true);
}
[pName, pUni, pCourse, pExam].forEach(el => el.addEventListener('change', saveProfileFromInputs));
document.getElementById('profileChip').onclick = () => { syncProfile(); profileDlg.showModal(); };
syncProfile(true);

/* ---------- shared bits ---------- */
async function loadGames() {
  const res = await fetch('/api/games');
  if (!res.ok) throw new Error('host API unreachable');
  return res.json();
}
const fmtTime = ms => {
  const s = Math.round(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
function renderBoard(slug, mode) {
  const rows = readJSON(lbKey(slug, mode)) || [];
  if (!rows.length) return `<p class="muted">No ${mode} scores yet — be the first.</p>`;
  return `<table class="lb"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Time</th></tr></thead>
    <tbody>${rows.map((r, i) =>
      `<tr><td>${i + 1}</td><td>${esc(r.player)}</td><td><b>${r.score}</b> / ${r.max}</td><td>${fmtTime(r.durationMs)}</td></tr>`
    ).join('')}</tbody></table>`;
}
function recordScore(slug, mode, entry) {
  const rows = readJSON(lbKey(slug, mode)) || [];
  rows.push(entry);
  rows.sort((a, b) => b.score - a.score || a.durationMs - b.durationMs);
  writeJSON(lbKey(slug, mode), rows.slice(0, 10));
}

/* ---------- browse view ---------- */
function viewBrowse(games) {
  const view = document.getElementById('view');
  view.parentElement.classList.remove('wide');
  view.innerHTML = `
    <h1>Playable study games</h1>
    <p class="muted" style="margin-top:0">Every published bundle in <code>games/</code> shows up here.</p>
    <div class="card gamecard" style="border-style:dashed">
      <div class="thumb">🛠️</div>
      <div style="flex:1">
        <h3>Nothing for your course yet?</h3>
        <p>Drop your lecture notes, pick a vibe, and Claude (on your own subscription) builds the game.</p>
      </div>
      <a class="btn primary" href="#/create">Build a game →</a>
    </div>
    ${games.map(({ slug, manifest: m }) => `
      <div class="card gamecard">
        <div class="thumb">🧠</div>
        <div style="flex:1">
          <h3>${esc(m.title)}</h3>
          <p>${esc(m.description)}</p>
          <div class="meta">
            <span>🏛️ ${esc(m.university)}</span><span>📚 ${esc(m.course)}</span>${m.topic ? `<span>📁 ${esc(m.topic)}</span>` : ''}
            <span>⏱ ~${m.estimatedMinutes} min</span><span>🎯 ${esc(m.difficulty)}</span>
          </div>
          <div class="tags">${(m.tags || []).map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div>
        </div>
        <a class="btn primary" href="#/play/${slug}">Play →</a>
      </div>`).join('')}
    <div class="card proto">
      Demo plumbing: <b>apps/web</b> and <b>apps/sandbox</b> are stubs in this scaffold, so this shell
      plus <code>demo/server.py</code> stand in for them. Games run in a sandboxed iframe on
      <b>${new URL(SANDBOX_ORIGIN).host}</b> with <code>connect-src 'none'</code> — they cannot touch
      the network, read host cookies, or escape. Host ↔ game talk is the version-1
      <code>postMessage</code> protocol from <code>packages/schema/src/messages.ts</code>.
      Creation runs the local <code>claude</code> CLI headless on your subscription.
    </div>`;
}

/* ---------- play view ---------- */
function viewPlay({ slug, manifest: m, sandboxUrl }) {
  const view = document.getElementById('view');
  view.parentElement.classList.remove('wide');
  let mode = (m.modes || ['practice'])[0];
  let readyDone = false, readyTimer = null, frame = null;
  const player = { displayName: readProfile().displayName };

  view.innerHTML = `
    <p class="back"><a href="#/">← all games</a></p>
    <div class="row" style="justify-content:space-between">
      <div>
        <h1>${esc(m.title)}</h1>
        <div class="meta"><span>🏛️ ${esc(m.university)} · ${esc(m.course)}</span>${m.topic ? `<span>📁 ${esc(m.topic)}</span>` : ''}</div>
      </div>
      <div class="row" id="modeBtns">
        ${(m.modes || ['practice']).map(md =>
          `<button data-mode="${md}" class="${md === mode ? 'primary' : ''}">${md === 'practice' ? '🛟 practice' : '⏱ test'}</button>`).join('')}
      </div>
    </div>
    <p class="muted" style="font-size:13px">${mode === 'practice'
      ? 'Practice — untimed, answers shown, autosaves your position.'
      : 'Test — scored and timed; the result lands on the board below.'}</p>

    <div class="stagewrap">
      <iframe class="game" height="560" style="height:560px"
              sandbox="allow-scripts" referrerpolicy="no-referrer"
              title="game preview"></iframe>
      <div class="overlay" id="loading"><div><h2>Starting game…</h2>
        <p class="muted">Waiting for <code>ready</code> (10 s limit, per the contract)</p></div></div>
      <div class="overlay" id="broken" hidden><div><h2 class="error">This game looks broken</h2>
        <p class="muted">It never posted <code>ready</code> within 10 seconds.<br>
        In production you could report this from here — it's how a bad bundle fails loudly.</p></div></div>
      <div class="overlay" id="result" hidden><div>
        <h2>${mode === 'test' ? 'Test complete' : 'Run complete'}</h2>
        <div class="score-big" id="rScore"></div>
        <p class="muted" id="rDetail"></p>
        <div class="row" style="justify-content:center">
          <button class="primary" id="rAgain">Play again</button>
          <button id="rBack">Back to games</button>
        </div></div></div>
    </div>
    <div class="hud">
      <span id="hudMode">${mode} mode</span>
      <span class="track"><i id="hudBar"></i></span>
      <span id="hudProg">0 / 0</span>
      <span class="pill">iframe · ${new URL(sandboxUrl).host}</span>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <b>Leaderboard — ${mode} mode</b>
        <span class="muted" style="font-size:12px">stored in your browser</span>
      </div>
      <div id="lb">${renderBoard(slug, mode)}</div>
    </div>`;

  frame = view.querySelector('iframe.game');
  const el = id => view.querySelector(id);

  const setMode = md => {
    mode = md;
    view.querySelectorAll('#modeBtns button').forEach(b =>
      b.classList.toggle('primary', b.dataset.mode === md));
    el('#hudMode').textContent = mode + ' mode';
    el('#lb').innerHTML = renderBoard(slug, mode);
    boot();
  };

  function boot() {
    readyDone = false;
    clearTimeout(readyTimer);
    readyTimer = setTimeout(() => { if (!readyDone) el('#broken').hidden = false; }, 10_000);
    el('#hudBar').style.width = '0%';
    el('#hudProg').textContent = '0 / 0';
    el('#loading').hidden = false; el('#result').hidden = true; el('#broken').hidden = true;
    frame.src = sandboxUrl + (m.entry || 'index.html');
  }

  const onMsg = e => {
    if (e.source !== frame.contentWindow || e.origin !== SANDBOX_ORIGIN) return;
    const d = e.data;
    if (!d || d.v !== PROTOCOL_VERSION) return;

    if (d.type === 'ready') {
      readyDone = true;
      clearTimeout(readyTimer);
      el('#loading').hidden = true;
      post(frame, 'init', {
        mode, seed: Math.floor(Math.random() * 1e9), player,
        resume: readJSON(saveKey(slug, mode)),
      });
    } else if (d.type === 'progress') {
      const { done, total } = d.payload;
      el('#hudBar').style.width = (done / total * 100) + '%';
      el('#hudProg').textContent = `${done} / ${total}`;
    } else if (d.type === 'save') {
      writeJSON(saveKey(slug, mode), d.payload.state);
    } else if (d.type === 'resize') {
      frame.style.height = Math.min(Math.max(d.payload.height, 200), 1600) + 'px';
    } else if (d.type === 'error') {
      el('#broken').hidden = false;
    } else if (d.type === 'complete') {
      const { score, max, durationMs } = d.payload;
      // Campaign games keep their SRS state across sessions — a finished session
      // must NOT wipe the save; yesterday's player resumes right back in.
      el('#rScore').textContent = `${score} / ${max}`;
      el('#rDetail').textContent = `${mode} mode · ${fmtTime(durationMs)}`;
      el('#result').hidden = false;
      recordScore(slug, mode, { player: player.displayName, score, max, durationMs });
      el('#lb').innerHTML = renderBoard(slug, mode);
    }
  };
  addEventListener('message', onMsg);
  document.addEventListener('visibilitychange', function onVis() {
    if (!view.isConnected) return document.removeEventListener('visibilitychange', onVis);
    frame.contentWindow && post(frame, document.hidden ? 'pause' : 'resume');
  });

  view.querySelectorAll('#modeBtns button').forEach(b => (b.onclick = () => setMode(b.dataset.mode)));
  el('#rAgain').onclick = boot;
  el('#rBack').onclick = () => (location.hash = '#/');

  boot();
  const off = () => { removeEventListener('message', onMsg); removeEventListener('hashchange', off); clearTimeout(readyTimer); };
  addEventListener('hashchange', off);
}

/* ---------- create view ---------- */
const UI_TYPES = [
  { id: 'surprise',   label: '🎲 Surprise me',       blurb: 'Claude picks the format that fits your notes best.' },
  { id: 'quickfire',  label: '⚡ Quickfire quiz',    blurb: 'One question at a time, fast — keys 1–4.' },
  { id: 'flashcards', label: '🃏 Flashcards sprint', blurb: 'Recall it before the timer bar runs out.' },
  { id: 'matchup',    label: '🔗 Match-up',          blurb: 'Drag terms onto their definitions.' },
  { id: 'sort',       label: '🔀 Sort / sequence',   blurb: 'Put steps or events back in the right order.' },
  { id: 'spoterror',  label: '🕵️ Spot the error',    blurb: 'Find what is wrong in each statement.' },
];
const THEMES = [
  { id: 'cyberdojo', label: 'Cyberdojo', p: ['#0d0b1f', '#171233', '#a855f7', '#22d3ee'] },
  { id: 'library',   label: 'Library',   p: ['#f6efe3', '#fffdf7', '#b45309', '#433422'] },
  { id: 'arcade',    label: 'Retro arcade', p: ['#1a1a2e', '#241c46', '#ff6b35', '#ffd23f'] },
  { id: 'midnight',  label: 'Midnight',  p: ['#0f1115', '#16181e', '#e6e8ee', '#8ec1ff'] },
  { id: 'campus',    label: 'Campus green', p: ['#0e1512', '#14201a', '#4ade80', '#a7f3d0'] },
];
const STAGE_LABELS = ['queued', 'reading sources', 'drafting your game', 'writing files', 'validating bundle', 'done'];
const fmtKB = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

function viewCreate() {
  const view = document.getElementById('view');
  view.parentElement.classList.add('wide');
  const profile = readProfile();
  const opts = { uiType: 'surprise', theme: 'cyberdojo', items: 40, minutes: 12, ...(readJSON(OPTIONS_KEY) || {}) };
  const state = { sources: [], jobId: null, poll: null };

  view.innerHTML = `
    <h1>Build a game</h1>
    <p class="muted" style="margin-top:0">Upload your course material — your Claude subscription turns it into a <b style="color:var(--fg)">dojo campaign</b>: earn XP, keep a streak, drill the whole semester over weeks with spaced repetition.</p>
    <div class="grid2">
      <div>
        <div class="card" style="position:sticky;top:74px">
          <h2 class="sect">Sources</h2>
          <div class="dz" id="dz">⬆️ Drop files here<br><span class="muted">or click to browse<br>txt · md · pdf · png · jpg · webp — 12 MB each, max 8</span></div>
          <input type="file" id="fileIn" multiple hidden accept=".txt,.md,.markdown,.pdf,.png,.jpg,.jpeg,.webp">
          <div id="srcList"></div>
          <details class="paste">
            <summary>or paste notes as text…</summary>
            <textarea id="pasteText" rows="6" placeholder="Paste lecture notes here…" style="margin-top:8px"></textarea>
            <div class="row" style="margin-top:8px;justify-content:flex-end">
              <button id="pasteAdd">Add as source</button>
            </div>
          </details>
          <p class="muted" id="srcSum" style="font-size:12px;margin:12px 0 0"></p>
        </div>
      </div>
      <div id="rightCol">
        <div class="card">
          <h2 class="sect">Your course</h2>
          <div class="frow">
            <div><label class="field">University</label><input type="text" id="cUni" value="${esc(profile.university)}" placeholder="My University"></div>
            <div><label class="field">Course code</label><input type="text" id="cCourse" value="${esc(profile.course)}" placeholder="BIO101"></div>
          </div>
          <label class="field">Exam date — the campaign paces itself to <i>your</i> date; everyone's exam is a different day</label>
          <input type="date" id="cExam" value="${profile.examDate || ''}">
          <div class="examline" id="examLine"></div>
          <div class="frow">
            <div>
              <div class="row" style="justify-content:space-between"><label class="field" style="margin:0">Campaign size</label><span class="badge" id="itemsB">${opts.items} items</span></div>
              <input type="range" id="cItems" min="10" max="200" step="5" value="${opts.items}">
            </div>
            <div>
              <div class="row" style="justify-content:space-between"><label class="field" style="margin:0">Daily session</label><span class="badge" id="minsB">${opts.minutes} min/day</span></div>
              <input type="range" id="cMins" min="5" max="25" step="1" value="${opts.minutes}">
            </div>
          </div>
        </div>
        <div class="card">
          <h2 class="sect">How should you play it?</h2>
          <div class="optgrid">
            ${UI_TYPES.map(t => `<div class="opt"><input type="radio" name="uitype" id="u_${t.id}" value="${t.id}" ${t.id === opts.uiType ? 'checked' : ''}>
              <label for="u_${t.id}"><div class="t">${t.label}</div><div class="b">${t.blurb}</div></label></div>`).join('')}
          </div>
        </div>
        <div class="card">
          <h2 class="sect">Pick a vibe</h2>
          <div class="optgrid">
            ${THEMES.map(t => `<div class="opt"><input type="radio" name="theme" id="t_${t.id}" value="${t.id}" ${t.id === opts.theme ? 'checked' : ''}>
              <label for="t_${t.id}"><div class="themedot">${t.p.map(c => `<i style="background:${c}"></i>`).join('')}</div>
              <div class="t">${t.label}</div></label></div>`).join('')}
          </div>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:4px">
          <span class="muted" style="font-size:13px">🤖 claude CLI · your subscription's default model</span>
          <button class="primary" id="buildBtn" style="font-size:16px;padding:12px 26px" disabled>🥋 Build my game</button>
        </div>
      </div>
    </div>`;

  const $ = id => view.querySelector('#' + id);
  const dz = $('dz'), fileIn = $('fileIn'), srcList = $('srcList'), buildBtn = $('buildBtn');

  /* pacing line */
  function pacing() {
    const days = daysToExam($('cExam').value || null);
    const items = +$('cItems').value, mins = +$('cMins').value;
    if (days == null) { $('examLine').innerHTML = '<span class="muted">Set your exam date → campaign length, pacing and review waves adapt to <b>you</b>.</span>'; return; }
    if (days < 0) { $('examLine').innerHTML = '📅 That exam date is in the past — pick a future one.'; return; }
    const sessionsNeeded = 4; // learn + 3 review waves, minimum
    const total = Math.ceil(items * sessionsNeeded / 10 * 10); // rough XP grind estimate line
    $('examLine').innerHTML =
      `📅 <b>${days}</b> days until your exam · campaign of <b>${items}</b> items ≈ <b>${Math.ceil(items / (mins * 1.2))}</b> sessions to learn, spaced reviews keep coming until exam day — you earn ~${total / 10} XP per day.`;
  }

  function persistAll() {
    const cur = readProfile();
    writeJSON(PROFILE_KEY, {
      ...cur,
      university: $('cUni').value.trim(), course: $('cCourse').value.trim(),
      examDate: $('cExam').value || null,
    });
    writeJSON(OPTIONS_KEY, {
      uiType: view.querySelector('input[name=uitype]:checked')?.value || 'surprise',
      theme: view.querySelector('input[name=theme]:checked')?.value || 'cyberdojo',
      items: +$('cItems').value, minutes: +$('cMins').value,
    });
    syncProfile(true);
  }

  function gate() {
    buildBtn.disabled = !(state.sources.length && $('cUni').value.trim() && $('cCourse').value.trim());
  }

  /* sources */
  async function upload(fileOrText, name) {
    if (state.sources.length >= 8) return;
    const row = document.createElement('div');
    row.className = 'src';
    row.innerHTML = `<span>⏳</span><span class="nm">${esc(name)}</span>`;
    srcList.appendChild(row);
    const res = await fetch('/api/upload?name=' + encodeURIComponent(name), { method: 'POST', body: fileOrText });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      row.innerHTML = `<span>⚠️</span><span class="err">${esc(data.error || 'upload failed')}</span>`;
      return;
    }
    const icon = data.kind === 'text' ? '📄' : data.name.endsWith('.pdf') ? '📕' : '🖼️';
    row.innerHTML = `<span>${icon}</span><span class="nm" title="${esc(data.name)}">${esc(data.name)}</span>
      <span class="sz">${fmtKB(data.size)}</span><button class="x">✕</button>`;
    row.querySelector('.x').onclick = async () => {
      await fetch('/api/upload/' + data.id, { method: 'DELETE' });
      state.sources = state.sources.filter(s => s.id !== data.id);
      row.remove(); gate();
    };
    state.sources.push(data); gate();
  }

  dz.onclick = () => fileIn.click();
  fileIn.onchange = async () => { for (const f of fileIn.files) await upload(f, f.name); fileIn.value = ''; };
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = async e => {
    e.preventDefault(); dz.classList.remove('over');
    for (const f of e.dataTransfer.files) await upload(f, f.name);
  };
  $('pasteAdd').onclick = async () => {
    const t = $('pasteText').value.trim();
    if (!t) return;
    await upload(t, 'pasted-notes.txt');
    $('pasteText').value = '';
  };

  $('cItems').oninput = () => { $('itemsB').textContent = $('cItems').value + ' items'; pacing(); };
  $('cMins').oninput = () => { $('minsB').textContent = $('cMins').value + ' min/day'; pacing(); };
  ['cUni', 'cCourse', 'cExam', 'cItems', 'cMins'].forEach(id => $(id).addEventListener('change', () => { persistAll(); gate(); }));
  view.querySelectorAll('input[name=uitype],input[name=theme]').forEach(r => r.addEventListener('change', persistAll));
  pacing(); gate();

  /* build → job */
  buildBtn.onclick = async () => {
    persistAll();
    const p = readProfile();
    const o = readJSON(OPTIONS_KEY);
    const job = {
      uploads: state.sources.map(s => s.id),
      options: o,
      profile: { displayName: p.displayName, examDate: p.examDate, university: p.university, course: p.course },
    };
    const res = await fetch('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(job) });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'could not start job'); return; }
    state.jobId = data.id;
    showJob(data.id);
  };

  function showJob(id) {
    const right = $('rightCol');
    right.innerHTML = `
      <div class="card">
        <h2 class="sect">Claude is building your game — one shot, everything on your subscription</h2>
        <div id="stages">${STAGE_LABELS.map((l, i) =>
          `<div class="stagerow" data-i="${i}"><span class="dot"></span>${l}</div>`).join('')}</div>
        <div class="row" style="margin-top:10px">
          <span class="track"><i id="jBar"></i></span>
          <span class="muted" style="font-size:13px" id="jTime">0s</span>
        </div>
        <pre class="tail" id="jTail">waiting for the first line from claude…</pre>
        <div class="row" style="margin-top:10px;justify-content:flex-end">
          <button id="jCancel">cancel</button>
        </div>
      </div>`;
    const tail = right.querySelector('#jTail');
    $('jCancel').onclick = () => { fetch(`/api/jobs/${id}/cancel`, { method: 'POST' }); };
    state.poll = setInterval(async () => {
      const res = await fetch('/api/jobs/' + id).catch(() => null);
      const job = res && (await res.json());
      if (!job || job.error && job.stage !== 'error') return;
      right.querySelectorAll('.stagerow').forEach(row => {
        const i = +row.dataset.i;
        row.className = 'stagerow' + (i < job.stageIndex ? ' done' : i === job.stageIndex ? ' on' : '');
      });
      right.querySelector('#jBar').style.width = (Math.min(job.stageIndex, job.stageTotal - 1) / (job.stageTotal - 1) * 100) + '%';
      right.querySelector('#jTime').textContent = job.elapsedS + 's';
      if (job.tail) { tail.textContent = job.tail; tail.scrollTop = tail.scrollHeight; }
      if (job.stage === 'done') { clearInterval(state.poll); showResult(job); }
      if (job.stage === 'error') { clearInterval(state.poll); showJobError(job); }
    }, 1500);
  }

  function showResult(job) {
    const right = $('rightCol');
    const m = job.manifest || {};
    right.innerHTML = `
      <div class="card gamecard" style="border-color:var(--good)">
        <div class="thumb" style="background:color-mix(in srgb, var(--good) 15%, transparent)">🎮</div>
        <div style="flex:1">
          <h3>${esc(job.title)}</h3>
          <p>${esc(m.description || '')}</p>
          <div class="meta"><span>⏱ ~${m.estimatedMinutes || '?'} min</span><span>🎯 ${esc(m.difficulty || '')}</span><span class="pill warn">draft — not on the homepage yet</span></div>
        </div>
      </div>
      <div class="card">
        <h2 class="sect">Preview — same sandbox as production, try it before anyone sees it</h2>
        <div class="stagewrap">
          <iframe class="game" id="pv" style="height:520px" sandbox="allow-scripts"
                  referrerpolicy="no-referrer" title="draft preview"></iframe>
        </div>
        <div class="row" style="margin-top:14px;justify-content:flex-end">
          <button id="pvBack">← tweak options</button>
          <button class="primary" id="pvPub" style="font-size:16px;padding:12px 26px">Publish to the dojo 🚀</button>
        </div>
      </div>`;
    const pv = right.querySelector('#pv');
    const onMsg = e => {
      if (e.source !== pv.contentWindow || e.origin !== SANDBOX_ORIGIN) return;
      const d = e.data;
      if (!d || d.v !== PROTOCOL_VERSION) return;
      if (d.type === 'ready')
        post(pv, 'init', { mode: 'practice', seed: 42, player: { displayName: readProfile().displayName }, resume: null });
      if (d.type === 'resize')
        pv.style.height = Math.min(Math.max(d.payload.height, 200), 1600) + 'px';
    };
    addEventListener('message', onMsg);
    const off = () => { removeEventListener('message', onMsg); removeEventListener('hashchange', off); };
    addEventListener('hashchange', off);
    pv.src = `${SANDBOX_ORIGIN}/drafts/${job.slug}/index.html`;

    right.querySelector('#pvBack').onclick = () => viewCreate();
    right.querySelector('#pvPub').onclick = async () => {
      const res = await fetch(`/api/games/${job.slug}/publish`, { method: 'POST' });
      if (res.ok) location.hash = '#/play/' + job.slug;
      else alert((await res.json()).error || 'publish failed');
    };
  }

  function showJobError(job) {
    const right = $('rightCol');
    right.innerHTML = `
      <div class="card" style="border-color:color-mix(in srgb, var(--bad) 60%, transparent)">
        <h2 class="sect" style="color:var(--bad)">Generation failed</h2>
        <pre class="tail" style="color:var(--bad);height:auto;max-height:220px">${esc(job.error || 'unknown error')}</pre>
        <div class="row" style="margin-top:14px">
          <button class="primary" id="jRetry">🔁 Try again with same sources</button>
          <button id="jTweak">← tweak options</button>
        </div>
      </div>`;
    right.querySelector('#jTweak').onclick = () => viewCreate();
    right.querySelector('#jRetry').onclick = () => buildBtn.onclick();
  }

  const off = () => { if (state.poll) clearInterval(state.poll); removeEventListener('hashchange', off); };
  addEventListener('hashchange', off);

  /* test hook: ?seed-demo=1 pre-fills everything so screenshots can capture the populated view */
  if (new URLSearchParams(location.search).get('seed-demo')) {
    $('cUni').value = 'TU Berlin'; $('cCourse').value = 'BIO101';
    const in60 = new Date(Date.now() + 62 * 864e5).toISOString().slice(0, 10);
    $('cExam').value = in60;
    $('pasteText').value = 'Mitochondrion: generates ATP via oxidative phosphorylation.\nRibosome: translates mRNA into polypeptide chains.\nGolgi apparatus: packages and sorts proteins for transport.\nLysosome: hydrolytic enzymes break down waste.\nNucleus: stores DNA, site of transcription.';
    persistAll(); pacing(); gate();
    $('pasteAdd').click();
  }
}

/* ---------- router ---------- */
async function route() {
  const view = document.getElementById('view');
  if (location.hash.startsWith('#/create')) return viewCreate();
  const m = location.hash.match(/^#\/play\/([a-z0-9-]+)/i);
  try {
    const games = await loadGames();
    if (m) {
      const g = games.find(g => g.slug === m[1]);
      if (g) return viewPlay(g);
    }
    viewBrowse(games);
  } catch (err) {
    view.parentElement.classList.remove('wide');
    view.innerHTML = `<p class="error">Could not reach the host API: ${esc(err.message)}</p>`;
  }
}
addEventListener('hashchange', route);
route();
</script>
