<script>
'use strict';
/* ============ persistence & rail ============ */
const SAVE_KEY='bptm_war_v1';
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.modes)return s}catch(e){}
  return {xp:0,streak:0,best:0,modes:{},boss:null};
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function modeStat(id){if(!S.modes[id])S.modes[id]={seen:0,right:0};return S.modes[id]}
const RANKS=[[0,'L0-Live'],[60,'L1-Live'],[150,'L2-Live'],[260,'L3-Live'],[400,'L4-Live'],[560,'Quasi-Live'],[780,'Strong-Live'],[1050,'Structurally Sound'],[1400,'Sound'],[1900,'Home State']];
function rank(){let r=RANKS[0][1];for(const[t,n]of RANKS)if(S.xp>=t)r=n;return r}
function rail(){
  document.getElementById('xpval').textContent=S.xp;
  document.getElementById('streakval').textContent=S.streak;
  document.getElementById('rankchip').textContent=rank();
}
function award(ok,pts){
  if(ok){S.xp+=pts+Math.min(S.streak,5);S.streak++;S.best=Math.max(S.best,S.streak);
    const t=document.getElementById('xptok');t.classList.remove('tokpop');void t.getBoundingClientRect();t.classList.add('tokpop');
  }else S.streak=0;
  save();rail();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle(a).slice(0,n)}

/* ============ PETRI NET ENGINE ============
   Firing rule per lecture Def 2.5 (PT nets), with capacity checked AFTER
   input consumption for places that are both input and output of t —
   this matches the official SS23 sample-solution reachability table.
   EC nets: every place has capacity 1, every arc weight 1.            */
function netMaps(net){
  if(net._m)return net._m;
  const inA={},outA={};                       // inA[t]=[{p,w}] arcs p->t ; outA[t]=[{p,w}]
  net.trans.forEach(t=>{inA[t.id]=[];outA[t.id]=[]});
  const cap={},places=net.places.map(p=>p.id);
  net.places.forEach(p=>{cap[p.id]=(net.type==='EC')?1:(p.cap!=null?p.cap:Infinity)});
  net.arcs.forEach(a=>{
    const w=a.w||1;
    if(inA[a.from]!==undefined) outA[a.from].push({p:a.to,w});   // t -> p
    else inA[a.to].push({p:a.from,w});                            // p -> t
  });
  net._m={inA,outA,cap,places};
  return net._m;
}
function mkey(M,places){return places.map(p=>M[p]||0).join(',')}
function enabledSet(net,M){
  const {inA,outA,cap}=netMaps(net);
  return net.trans.filter(t=>{
    for(const {p,w} of inA[t.id]) if((M[p]||0)<w) return false;
    // capacity check on marking after inputs consumed
    const tmp={};for(const {p,w} of inA[t.id])tmp[p]=(tmp[p]||0)+w;
    for(const {p,w} of outA[t.id]){
      const after=(M[p]||0)-(tmp[p]||0)+w;
      if(after>cap[p]) return false;
    }
    return true;
  }).map(t=>t.id);
}
function fire(net,M,tid){
  const {inA,outA}=netMaps(net);
  const M2=Object.assign({},M);
  for(const {p,w} of inA[tid]) M2[p]=(M2[p]||0)-w;
  for(const {p,w} of outA[tid]) M2[p]=(M2[p]||0)+w;
  return M2;
}
/* BFS reachability graph. Returns {order:[keys], markings:{key:M}, edges:[{from,t,to}], out:{key:[{t,to}]}, bounded, kbound, dead:[keys]} */
function explore(net){
  if(net._g)return net._g;
  const {places}=netMaps(net);
  const M0={};net.places.forEach(p=>{M0[p.id]=(net.m0&&net.m0[p.id])||0});
  const k0=mkey(M0,places);
  const markings={[k0]:M0},order=[k0],out={[k0]:[]},edges=[];
  const q=[k0];let bounded=true;
  while(q.length){
    const k=q.shift(),M=markings[k];
    for(const t of enabledSet(net,M)){
      const M2=fire(net,M,t),k2=mkey(M2,places);
      if(!(k2 in markings)){
        if(order.length>4000||Object.values(M2).some(v=>v>40)){bounded=false;continue}
        markings[k2]=M2;order.push(k2);out[k2]=[];q.push(k2);
      }
      edges.push({from:k,t,to:k2});out[k].push({t,to:k2});
    }
  }
  const dead=order.filter(k=>out[k].length===0);
  let kbound=0;order.forEach(k=>{for(const p of places)kbound=Math.max(kbound,markings[k][p]||0)});
  net._g={order,markings,edges,out,bounded,kbound,dead,places,k0};
  return net._g;
}
/* strict liveness class per transition: 'L0'|'L1'|'L3'|'L4' (L2 not distinguished, per lecture practice) */
function liveness(net){
  if(net._live)return net._live;
  const g=explore(net);
  const res={};
  // reachable-from map for cycle detection: forward BFS from each node (graphs here are small)
  const reachFrom={};
  for(const k of g.order){
    const seen=new Set([k]),q=[k];
    while(q.length){const c=q.shift();for(const e of g.out[c])if(!seen.has(e.to)){seen.add(e.to);q.push(e.to)}}
    reachFrom[k]=seen;
  }
  for(const t of net.trans){
    const id=t.id;
    const eOn=g.edges.filter(e=>e.t===id);
    if(eOn.length===0){res[id]='L0';continue}
    // L3: t lies on a cycle (target of a t-edge can get back to its source)
    const l3=eOn.some(e=>reachFrom[e.to].has(e.from));
    // L4: from EVERY reachable marking, a marking enabling t is reachable
    const enablers=new Set(g.order.filter(k=>enabledSet(net,g.markings[k]).includes(id)));
    const l4=g.order.every(k=>[...reachFrom[k]].some(x=>enablers.has(x)));
    res[id]=l4?'L4':(l3?'L3':'L1');
  }
  net._live=res;return res;
}
function netLivenessClass(net){
  const lv=liveness(net),vals=net.trans.map(t=>lv[t.id]);
  if(vals.every(v=>v==='L4'))return 'live';
  if(vals.some(v=>v==='L4'))return 'quasi';
  return 'notlive';
}
/* structural soundness: >=1 node w/o incoming, >=1 w/o outgoing, every node on a path initial->final */
function structSound(net){
  const nodes=[...net.places.map(p=>p.id),...net.trans.map(t=>t.id)];
  const succ={},pred={};nodes.forEach(n=>{succ[n]=[];pred[n]=[]});
  net.arcs.forEach(a=>{succ[a.from].push(a.to);pred[a.to].push(a.from)});
  const inits=nodes.filter(n=>pred[n].length===0),finals=nodes.filter(n=>succ[n].length===0);
  if(!inits.length||!finals.length)return{sound:false,inits,finals,reason:!inits.length?'no initial node (every node has an incoming edge)':'no final node (every node has an outgoing edge)'};
  const fwd=new Set(inits),q1=[...inits];
  while(q1.length){const c=q1.shift();for(const n of succ[c])if(!fwd.has(n)){fwd.add(n);q1.push(n)}}
  const bwd=new Set(finals),q2=[...finals];
  while(q2.length){const c=q2.shift();for(const n of pred[c])if(!bwd.has(n)){bwd.add(n);q2.push(n)}}
  const off=nodes.filter(n=>!(fwd.has(n)&&bwd.has(n)));
  return{sound:off.length===0,inits,finals,off,reason:off.length?off.join(', ')+' not on a path from initial to final node':''};
}

/* Petri net: places {id,x,y,cap}, trans {id,x,y}, arcs {from,to,w,bend} */
function drawNet(net,M,opt){
  opt=opt||{};
  const w=net.w||560,h=net.h||220,R=16,TW=12,TH=34;
  const pos={};net.places.forEach(p=>pos[p.id]={x:p.x,y:p.y,kind:'p'});net.trans.forEach(t=>pos[t.id]={x:t.x,y:t.y,kind:'t'});
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${Math.min(w,opt.maxw||720)}" role="img" aria-label="Petri net">`;
  s+=`<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker><marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>`;
  for(const a of net.arcs){
    const A=pos[a.from],B=pos[a.to];
    const rA=A.kind==='p'?R+2:20,rB=B.kind==='p'?R+4:20;
    const col=a.hl?'var(--accent)':'var(--ink)',mk=a.hl?'arrh':'arr',sw=a.hl?2:1.5;
    let lx,ly; // weight-label position, always ON the arc
    if(a.via&&a.via.length){
      // polyline routing through explicit waypoints
      let ux=a.via[0][0]-A.x,uy=a.via[0][1]-A.y,L=Math.hypot(ux,uy)||1;ux/=L;uy/=L;
      const sx=A.x+ux*rA,sy=A.y+uy*rA;
      const last=a.via[a.via.length-1];
      let vx=B.x-last[0],vy=B.y-last[1];L=Math.hypot(vx,vy)||1;vx/=L;vy/=L;
      const ex=B.x-vx*rB,ey=B.y-vy*rB;
      s+=`<path d="M${sx} ${sy} L${a.via.map(p=>p.join(' ')).join(' L')} L${ex} ${ey}" fill="none" stroke="${col}" stroke-width="${sw}" marker-end="url(#${mk})"/>`;
      if(a.via.length>1){const m1=a.via[Math.floor((a.via.length-1)/2)],m2=a.via[Math.ceil((a.via.length-1)/2+0.001)]||m1;lx=(m1[0]+m2[0])/2;ly=(m1[1]+m2[1])/2;}
      else{lx=a.via[0][0];ly=a.via[0][1];}
    }else{
      const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
      const x1=A.x+ux*rA,y1=A.y+uy*rA,x2=B.x-ux*rB,y2=B.y-uy*rB;
      if(a.bend){
        const cx=(x1+x2)/2-uy*a.bend,cy=(y1+y2)/2+ux*a.bend;
        s+=`<path d="M${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${sw}" marker-end="url(#${mk})"/>`;
        lx=0.25*x1+0.5*cx+0.25*x2;ly=0.25*y1+0.5*cy+0.25*y2; // quadratic curve at t=0.5
      }else{
        s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" marker-end="url(#${mk})"/>`;
        lx=(x1+x2)/2;ly=(y1+y2)/2;
      }
    }
    if(a.lxy){lx=a.lxy[0];ly=a.lxy[1]}
    if(a.w&&a.w>1){
      s+=`<circle cx="${lx}" cy="${ly}" r="9.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.2"/><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)" font-family="ui-monospace,Consolas,monospace">${a.w}</text>`;
    }
  }
  for(const p of net.places){
    s+=`<circle cx="${p.x}" cy="${p.y}" r="${R}" fill="var(--panel)" stroke="${p.hl?'var(--accent)':'var(--ink)'}" stroke-width="${p.hl?2.2:1.6}"/>`;
    const n=(M&&M[p.id])||0;
    if(n===1)s+=`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--tok)"/>`;
    else if(n===2)s+=`<circle cx="${p.x-5}" cy="${p.y}" r="4" fill="var(--tok)"/><circle cx="${p.x+5}" cy="${p.y}" r="4" fill="var(--tok)"/>`;
    else if(n===3)s+=`<circle cx="${p.x-5}" cy="${p.y+3}" r="4" fill="var(--tok)"/><circle cx="${p.x+5}" cy="${p.y+3}" r="4" fill="var(--tok)"/><circle cx="${p.x}" cy="${p.y-5}" r="4" fill="var(--tok)"/>`;
    else if(n>3)s+=`<text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--tok)" font-family="ui-monospace,Consolas,monospace">${n}</text>`;
    s+=`<text x="${p.x}" y="${p.y+R+14}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="ui-monospace,Consolas,monospace">${p.id}</text>`;
    if(p.cap!=null&&net.type!=='EC')s+=`<text x="${p.x+R+4}" y="${p.y-R+2}" font-size="11" font-weight="700" fill="var(--accent)" font-family="ui-monospace,Consolas,monospace">C=${p.cap}</text>`;
  }
  for(const t of net.trans){
    s+=`<rect x="${t.x-TW/2}" y="${t.y-TH/2}" width="${TW}" height="${TH}" fill="${t.hl?'var(--accent)':'var(--ink)'}" rx="1.5"/>`;
    s+=`<text x="${t.x}" y="${t.y+TH/2+14}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="ui-monospace,Consolas,monospace">${t.id}</text>`;
  }
  return s+'</svg>';
}
/* BPMN mini-renderer: items are primitives with absolute coords */
function bpmn(w,h,items){
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${Math.min(w,720)}" role="img" aria-label="BPMN model">`;
  s+=`<defs><marker id="barr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>`;
  const F='font-family="system-ui,sans-serif"';
  for(const it of items){
    if(it.k==='start')s+=`<circle cx="${it.x}" cy="${it.y}" r="13" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>`;
    else if(it.k==='end')s+=`<circle cx="${it.x}" cy="${it.y}" r="13" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>`;
    else if(it.k==='task'){
      const tw=it.w||64,th=34;
      s+=`<rect x="${it.x-tw/2}" y="${it.y-th/2}" width="${tw}" height="${th}" rx="7" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/><text x="${it.x}" y="${it.y+5}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)" ${F}>${esc(it.t)}</text>`;
    }else if(it.k==='gw'){
      const r=17;
      s+=`<path d="M${it.x} ${it.y-r} L${it.x+r} ${it.y} L${it.x} ${it.y+r} L${it.x-r} ${it.y} Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>`;
      if(it.t==='X')s+=`<text x="${it.x}" y="${it.y+5.5}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)" ${F}>×</text>`;
      else if(it.t==='+')s+=`<text x="${it.x}" y="${it.y+6}" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" ${F}>+</text>`;
      else if(it.t==='O')s+=`<circle cx="${it.x}" cy="${it.y}" r="7" fill="none" stroke="var(--ink)" stroke-width="1.8"/>`;
      else if(it.t==='E')s+=`<circle cx="${it.x}" cy="${it.y}" r="9" fill="none" stroke="var(--ink)" stroke-width="1.2"/><path d="M${it.x} ${it.y-5.5} L${it.x+5.2} ${it.y-1.7} L${it.x+3.2} ${it.y+4.5} L${it.x-3.2} ${it.y+4.5} L${it.x-5.2} ${it.y-1.7} Z" fill="none" stroke="var(--ink)" stroke-width="1.2"/>`;
    }else if(it.k==='arrow'){
      if(it.pts){
        let d='M'+it.pts.map(p=>p.join(' ')).join(' L');
        s+=`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#barr)"/>`;
        if(it.t){const lp=it.lp||it.pts[Math.floor(it.pts.length/2)];s+=`<text x="${lp[0]}" y="${lp[1]-6}" text-anchor="middle" font-size="12" fill="var(--muted)" ${F}>${esc(it.t)}</text>`}
      }
    }else if(it.k==='note'){
      s+=`<text x="${it.x}" y="${it.y}" text-anchor="${it.a||'middle'}" font-size="12" fill="var(--muted)" font-style="italic" ${F}>${esc(it.t)}</text>`;
    }
  }
  return s+'</svg>';
}

}

/* ============ MODE 2: generated net questions ============ */
function fmtM(net,M){const {places}=netMaps(net);return '('+places.map(p=>M[p]||0).join(', ')+')'}
function livWhy(cls,id){
  return {
    L0:`${id} is never enabled in any reachable marking, so it can never fire. That is a dead transition. Background: liveness is judged per transition by asking what firing futures are still possible.`,
    L1:`${id} can fire at least once, but it lies on no cycle of the reachability graph. Once its moment has passed it can never fire again, and this is already determined from the start.`,
    L3:`${id} lies on a cycle of the reachability graph. An infinite firing sequence through it EXISTS, but other runs leave the cycle or end. "Can fire forever" is L3; "will always stay fireable" would be L4.`,
    L4:`From every reachable marking it is always possible to reach a marking that enables ${id} again. Whatever happens, ${id} can keep firing. That is the strongest level, L4.`
  }[cls];
}
function buildNetQuestions(){
  const B=[];
  const push=q=>{q.mode='nets';B.push(q)};
  const liveOpts=(net,tid)=>{
    const cls=liveness(net)[tid];
    return {type:'mc',q:`What is the strict liveness of transition ${tid}?`,
      svg:drawNet(net,net.m0),
      opts:['L0','L1','L3','L4'].map(c=>({t:`${c}-live: `+({L0:'can never fire',L1:'fires at least once, but only a determined finite number of times',L3:'CAN fire infinitely often for some sequence (a loop with an exit)',L4:'stays fireable forever, from every reachable marking'}[c]),ok:c===cls})),
      why:livWhy(cls,tid)};
  };
  const netliveQ=(net,extra)=>{
    const cls=netLivenessClass(net),lv=liveness(net);
    const per=net.trans.map(t=>`${t.id}: ${lv[t.id]}`).join(', ');
    return {type:'mc',q:'Judge the liveness of the whole net.',note:extra,svg:drawNet(net,net.m0),
      opts:[
        {t:'Live (strong-live): every transition is L4-live',ok:cls==='live'},
        {t:'Quasi-live (weak-live): at least one transition is L4-live, but not all',ok:cls==='quasi'},
        {t:'Neither: no transition is L4-live',ok:cls==='notlive'},
      ],
      why:`Per-transition liveness here: ${per}. Background: first classify every single transition (L0 to L4), then judge the net. Live/strong-live means ALL transitions are L4. Quasi-live/weak-live means at least one L4 exists next to weaker ones. The weakest transition drags the whole net down.`};
  };
  const boundQ=net=>{
    const g=explore(net);const k=g.kbound;
    return {type:'mc',q:'Is the net bounded? If yes, for which k?',svg:drawNet(net,net.m0),
      opts:[
        {t:'1-bounded (safe): never more than 1 token in any single place',ok:g.bounded&&k===1},
        {t:'2-bounded: some place holds 2 tokens at some point, never more',ok:g.bounded&&k===2},
        {t:'3-bounded',ok:g.bounded&&k===3},
        {t:'Unbounded: some place can accumulate tokens forever',ok:!g.bounded},
      ],
      why:g.bounded?`Across all ${g.order.length} reachable markings the maximum number of tokens in any single place is ${k}. Background: boundedness is judged per place, not by the total in the net. In your reachability table it is simply the largest number in any column.`:'Token counts grow without limit.'};
  };
  const enabledQ=(net,M,label)=>{
    const en=enabledSet(net,M);
    return {type:'multi',q:`Which transitions are enabled at the marking M = ${fmtM(net,M)}${label?' ('+label+')':''}? (select all)`,
      svg:drawNet(net,M),
      opts:net.trans.map(t=>({t:t.id,ok:en.includes(t.id)})),
      why:(net.type==='EC'
        ?'E/C rule: a transition is enabled iff ALL its input places carry a token and its output places are free (capacity 1).'
        :'P/T rule (Def 2.5): for every input place M(p) ≥ W(p,t), and for every output place the tokens after firing must not exceed the capacity C(p).')
        +` Enabled here: ${en.length?en.join(', '):'none, this is a dead state'}.`};
  };
  const structQ=net=>{
    const st=structSound(net);
    return {type:'mc',q:'Is this net structurally sound (well-formed)?',svg:drawNet(net,net.m0),
      opts:[
        {t:'Yes: there is an initial node, a final node, and every node lies on a path between them',ok:st.sound},
        {t:'No: the structural conditions are violated',ok:!st.sound},
      ],
      why:st.sound
        ?`Def 2.10: an initial node without incoming edges exists (${st.inits.join(', ')}), a final node without outgoing edges exists (${st.finals.join(', ')}), and every node is on a path from initial to final. All three hold.`
        :`Def 2.10 fails: ${st.reason}. Background: structural soundness looks ONLY at the graph structure. Markings and firing behavior are completely ignored, which is why a structurally sound net can still deadlock.`};
  };

  push(enabledQ(NETS.SEQ,{i:1},'the initial marking'));
  push(structQ(NETS.SEQ));
  push(enabledQ(NETS.AND,{p1:1,p2:1},'after t1 has fired'));
  push(boundQ(NETS.AND));
  push({type:'mc',q:'Place i has TWO outgoing transitions t1 and t2, but only one token. What BPMN construct does this pattern correspond to?',
    svg:drawNet(NETS.CHOICE,NETS.CHOICE.m0),
    opts:[
      {t:'XOR gateway: both transitions are enabled but only one fires (non-determinism)',ok:true},
      {t:'AND gateway: both transitions fire',ok:false},
      {t:'Inclusive OR: one or both fire',ok:false},
      {t:'Event-based gateway: the token waits for an external event',ok:false},
    ],
    why:'A place with several output transitions models the XOR split: all are enabled, but firing one consumes the token, disabling the others. An AND split is one TRANSITION with several output places.'});
  push(liveOpts(NETS.CHOICE,'t3'));
  push(netliveQ(NETS.CYCLE,'tB returns the token via t* to i.'));
  push(structQ(NETS.CYCLE));
  push(liveOpts(NETS.DEAD,'t3'));
  push({type:'mc',q:'The net starts with one token in i. t1 and t2 form an XOR split, but t3 joins like an AND. What happens at runtime?',
    svg:drawNet(NETS.DEAD,NETS.DEAD.m0),
    opts:[
      {t:'Deadlock: after t1 or t2 fires, t3 waits forever for a token in the other place: a reachable marking where nothing is enabled and o is never reached',ok:true},
      {t:'The net terminates properly in o',ok:false},
      {t:'Livelock: the token cycles forever',ok:false},
      {t:'t3 fires with only one input token',ok:false},
    ],
    why:'Classic XOR-split/AND-join mismatch (Weske Fig 6.4). Only one of p1/p2 ever gets a token, but t3 needs BOTH. Note: the net is structurally sound: the defect is behavioral, which is why reachability analysis is needed.'});
  push(structQ(NETS.DEAD));
  push(liveOpts(NETS.LLOCK,'t2'));
  push(netliveQ(NETS.LLOCK,'p1→t2→p2→t3→p1 is a loop; t4 is the exit.'));
  push(netliveQ(NETS.QUASI,'Left component cycles forever; p3 never receives a token.'));
  push({type:'mc',q:'What type of Petri net is this, and why?',svg:drawNet(NETS.PTLEC,NETS.PTLEC.m0),
    opts:[
      {t:'P/T net: it uses an edge weight (2), a place capacity (C=1 on p3), and places holding more than one token',ok:true},
      {t:'E/C net: every place holds at most one token',ok:false},
      {t:'Workflow net: it has a dedicated i and o place',ok:false},
      {t:'Colored Petri net: the tokens are distinguishable',ok:false},
    ],
    why:'E/C nets N=(P,T,F) allow max. 1 token per place, no weights, no capacities. P/T nets N=(P,T,F,C,W,M0) extend them with capacities C, edge weights W (defaults: C=∞, W=1). Here p4 starts with 2 tokens and (p4,t1) has weight 2.'});
  push(enabledQ(NETS.PTLEC,{p4:2},'the initial marking. Mind the weight 2 on (p4,t1)!'));
  push(boundQ(NETS.PTLEC));
  (()=>{const g=explore(NETS.PTLEC);
    const yes=g.order.includes('1,1,1,0'),no=g.order.includes('0,0,0,1');
    push({type:'mc',q:'Is the marking M = (1, 1, 1, 0) for (p1, p2, p3, p4) reachable from M0 = (0, 0, 0, 2)?',svg:drawNet(NETS.PTLEC,NETS.PTLEC.m0),
      opts:[
        {t:'Yes: a firing sequence from M0 leads there',ok:yes},
        {t:'No: no firing sequence reaches it',ok:!yes},
      ],
      why:`A marking is reachable iff a firing sequence from M0 leads to it. Remember W(p4,t1)=2: firing t1 consumes BOTH tokens from p4. The full sequence: t1 → (1,1,0,0), t2 → (0,1,1,1), t3 → (0,0,1,2), t1 → (1,1,1,0). The net has ${g.order.length} reachable markings${yes?' and (1,1,1,0) is one of them':''}. Sanity check for (0,0,0,1): ${no?'reachable':'NOT reachable, tokens are never lost in this net'}.`});
  })();
  FORGE_SPECS.forEach(spec=>B.push(forgeQ(spec)));
  return B;
}

{type:'multi',q:'Which of these traces are possible for the code below? (select all)',

/* ============ MISSION RUNNER ============ */
let M={};
function startMission(modeId){
  const cfg=MODES[modeId];
  M={mode:modeId,qs:sample(cfg.bank(),cfg.take),i:0,right:0,results:[]};
  renderQ();
}
function qBlocks(q){
  let h='';
  if(q.note)h+=`<p class="qnote">${q.note}</p>`;
  if(q.svg)h+=`<div class="diagram">${q.svg}</div>`;
  if(q.code)h+=`<pre class="codeblock">${esc(q.code)}</pre>`;
  if(q.xml)h+=`<pre class="codeblock">${esc(q.xml)}</pre>`;
  return h;
}
function progBar(){
  return '<div class="mprog">'+M.qs.map((_,j)=>{
    if(j<M.i)return `<i class="${M.results[j]?'done':'fail'}"></i>`;
    if(j===M.i)return '<i class="cur"></i>';
    return '<i></i>';
  }).join('')+'</div>';
}
function renderQ(){
  if(M.i>=M.qs.length)return missionEnd();
  const q=M.qs[M.i],cfg=MODES[M.mode];
  let h=`<div class="card">
    <div class="qmeta"><span>${cfg.title}</span><span>${M.i+1} / ${M.qs.length}</span></div>
    ${progBar()}
    <div class="qtext">${q.q}</div>
    ${qBlocks(q)}`;
  if(q.type==='mc'||q.type==='multi'){
    const order=q._order||(q._order=shuffle(q.opts.map((_,ix)=>ix)));
    h+=`<div class="opts">`+order.map((oi,vi)=>{
      const o=q.opts[oi];
      const inner=o.code?`<pre>${esc(o.code)}</pre>`:(o.svgOpt?`<span style="display:block;min-width:0"><span style="display:block;font-size:13.5px;font-weight:600;margin-bottom:4px">${esc(o.t)}</span><span style="display:block;overflow-x:auto">${o.svgOpt}</span></span>`:esc(o.t));
      return `<button class="opt" id="opt${vi}" data-oi="${oi}" onclick="pick(${vi})"><span class="key">${vi+1}</span><span style="min-width:0">${inner}</span></button>`;
    }).join('')+`</div>`;
    if(q.type==='multi')h+=`<div class="btnrow"><button class="btn" onclick="submitMulti()">Check selection</button><span class="qnote">select every correct answer: graded like the exam: all or nothing</span></div>`;
  }else if(q.type==='text'){
    h+=`<div class="tin"><input id="tanswer" autocomplete="off" spellcheck="false" placeholder="your answer…" onkeydown="if(event.key==='Enter')submitText()"><button class="btn" onclick="submitText()">Check</button></div>`;
  }
  h+=`<div id="verdict"></div></div>
  <div class="btnrow"><button class="btn ghost" onclick="go('home')">Exit drill</button></div>`;
  SCREEN.innerHTML=h;
  const inp=document.getElementById('tanswer');if(inp)inp.focus();
}
function pick(vi){
  const q=M.qs[M.i];
  if(q.type==='multi'){document.getElementById('opt'+vi).classList.toggle('sel');return}
  const chosen=q.opts[+document.getElementById('opt'+vi).dataset.oi];
  finishQ(!!chosen.ok,vi);
}
function submitMulti(){
  const q=M.qs[M.i];
  let allRight=true;
  document.querySelectorAll('.opt').forEach(b=>{
    const o=q.opts[+b.dataset.oi],sel=b.classList.contains('sel');
    if(sel!==!!o.ok)allRight=false;
  });
  finishQ(allRight,null);
}
function submitText(){
  const q=M.qs[M.i],v=document.getElementById('tanswer').value;
  finishQ(norm(v)===norm(q.answer),null);
}
function finishQ(ok,pickedVi){
  const q=M.qs[M.i];
  // reveal
  document.querySelectorAll('.opt').forEach(b=>{
    const o=q.opts[+b.dataset.oi],sel=b.classList.contains('sel')||(pickedVi!==null&&b.id==='opt'+pickedVi);
    b.disabled=true;b.classList.remove('sel');
    if(o.ok&&sel)b.classList.add('right');
    else if(o.ok)b.classList.add(q.type==='multi'?'missed':'right');
    else if(sel)b.classList.add('wrong');
  });
  const inp=document.getElementById('tanswer');if(inp){inp.disabled=true}
  const pts=q.type==='mc'?10:12;
  award(ok,pts);
  const st=modeStat(M.mode);st.seen++;if(ok)st.right++;save();
  M.results.push(ok);if(ok)M.right++;
  const v=document.getElementById('verdict');
  v.innerHTML=`<div class="verdict ${ok?'ok':'bad'}"><div class="vh">${ok?'✓ Correct'+(S.streak>1?' · streak '+S.streak:''):'✗ Wrong'}</div>
    ${q.type==='text'&&!ok?`<p><b>Expected:</b> <span class="mono">${esc(q.answer)}</span></p>`:''}
    <p>${q.why||''}</p>
    ${!ok?`<p style="margin-top:8px">New to this topic? The <a href="#" onclick="go('manual');return false" style="color:var(--accent);font-weight:600">Cheat Sheet</a> explains it from scratch. Your run stays paused while you read.</p>`:''}</div>
    <div class="btnrow"><button class="btn" id="nextbtn" onclick="M.i++;renderQ()">Next →</button>${!ok?`<button class="btn ghost" onclick="go('manual')">Open Cheat Sheet</button>`:''}</div>`;
  document.getElementById('nextbtn').focus();
}
function missionEnd(){
  const cfg=MODES[M.mode],pct=Math.round(100*M.right/M.qs.length);
  const msg=pct>=90?'Exam-ready. Rotate to a weaker topic.':pct>=70?'Solid. One more pass and this one sits.':pct>=50?'Shaky. Skim the Cheat Sheet section, then run it again.':'Rough run. Open the Cheat Sheet, then retry immediately.';
  SCREEN.innerHTML=`<div class="card" style="text-align:center">
    <div class="qmeta" style="justify-content:center"><span>${cfg.title}: results</span></div>
    <div class="bigscore">${M.right} / ${M.qs.length}</div>
    <p class="sub" style="margin:0 auto 10px">${msg}</p>
    <div class="btnrow" style="justify-content:center">
      <button class="btn" onclick="startMission('${M.mode}')">Run again</button>
      <button class="btn ghost" onclick="go('manual')">Cheat sheet</button>
      <button class="btn ghost" onclick="go('home')">Overview</button>
    </div></div>`;
}

/* ============ REACHABILITY LAB ============ */
const REACH_LEVELS=[
  {net:'AND',name:'Drill 1 · E/C warm-up',note:'An E/C net: every place holds max. 1 token. Build the full reachability table.'},
  {net:'PTLEC',name:'Drill 2 · P/T with weight & capacity',note:'The lecture net: weight 2 on (p4,t1), capacity 1 on p3. Watch both firing conditions.'},
  {net:'EX22',name:'Drill 3 · Sample Exam 2022, Problem 3: the real thing',note:'This is the actual net from the 2022 sample exam. Formal definition below.'},
  {net:'EX23',name:'Final Drill · Endterm SS23, Problem 3: the real thing',note:'The actual SS23 endterm net. Capacity check: tokens AFTER firing may not exceed C(p). Note W(p2,t1)=3 vs C(p2)=2 …'},
];
let R={};
function startReach(li){
  li=li||0;
  const lv=REACH_LEVELS[li],net=NETS[lv.net];
  delete net._g;delete net._live;   // fresh
  const g=explore(net);
  R={li,lv,net,g,found:[g.k0],queue:[g.k0],phase:'enable',curIdx:0,fireList:[],fireAt:0,finals:null,fi:0,mistakes:0,steps:0};
  renderReach();
}
function reachTable(){
  const {places}=netMaps(R.net);
  let h=`<div class="tablewrap"><table class="reach"><tr><th>No.</th>${places.map(p=>`<th>${p}</th>`).join('')}<th>firing transition</th></tr>`;
  R.found.forEach((k,ix)=>{
    const M=R.g.markings[k];
    let fireCol='';
    if(ix<R.curIdx)fireCol=R.g.out[k].length?R.g.out[k].map(e=>`${e.t} → M${R.found.indexOf(e.to)}`).join('<br>'):'<i>— dead state</i>';
    else if(ix===R.curIdx)fireCol=R.phase==='enable'?'?':R.g.out[k].slice(0,R.fireAt).map(e=>`${e.t} → M${R.found.indexOf(e.to)}`).join('<br>')+(R.fireAt<R.g.out[k].length?(R.fireAt?'<br>':'')+R.g.out[k][R.fireAt].t+' → ?':'');
    h+=`<tr class="${ix===R.curIdx&&R.phase!=='final'?'cur':''}"><td class="mk">M${ix}</td>${places.map(p=>`<td>${M[p]||0}</td>`).join('')}<td style="text-align:left">${fireCol}</td></tr>`;
  });
  return h+'</table></div>';
}
function renderReach(msg,bad){
  const net=R.net,curKey=R.found[R.curIdx],Mcur=R.g.markings[curKey];
  let h=`<div class="card">
    <div class="qmeta"><span>Reachability Lab</span><span>${R.lv.name}</span></div>
    <p class="qnote">${R.lv.note}</p>
    ${net.formal?`<pre class="codeblock">${esc(net.formal)}</pre>`:''}
    <div class="diagram">${drawNet(net,R.phase==='final'?net.m0:Mcur)}</div>
    ${reachTable()}`;
  if(R.phase==='enable'){
    h+=`<div class="qtext">M${R.curIdx}: which transitions are enabled?</div>
      <p class="qnote">Select all enabled transitions (none = dead state), then confirm.</p>
      <div class="chips">${net.trans.map(t=>`<button class="chip" id="ch_${t.id}" onclick="this.classList.toggle('sel')">${t.id}</button>`).join('')}</div>
      <div class="btnrow"><button class="btn" onclick="checkEnabled()">Confirm</button></div>`;
  }else if(R.phase==='fire'){
    const e=R.g.out[curKey][R.fireAt];
    const {places}=netMaps(net);
    h+=`<div class="qtext">Fire ${e.t} at M${R.curIdx}: what is the resulting marking?</div>
      <p class="qnote">Token count for (${places.join(', ')}), comma-separated: e.g. <span class="mono">0,1,1,0</span></p>
      <div class="tin"><input id="mkin" autocomplete="off" spellcheck="false" placeholder="${places.map(()=>'·').join(',')}" onkeydown="if(event.key==='Enter')checkMarking()"><button class="btn" onclick="checkMarking()">Fire</button></div>`;
  }else if(R.phase==='final'){
    h+=finalQHtml();
  }
  h+=`<div id="verdict">${msg?`<div class="verdict ${bad?'bad':'ok'}"><div class="vh">${bad?'✗ Check the firing rule':'✓ Correct'}</div><p>${msg}</p></div>`:''}</div></div>
  <div class="btnrow"><button class="btn ghost" onclick="go('home')">Abort</button></div>`;
  SCREEN.innerHTML=h;
  const inp=document.getElementById('mkin');if(inp)inp.focus();
}
function checkEnabled(){
  const curKey=R.found[R.curIdx];
  const truth=enabledSet(R.net,R.g.markings[curKey]).sort().join(',');
  const sel=R.net.trans.filter(t=>document.getElementById('ch_'+t.id).classList.contains('sel')).map(t=>t.id).sort().join(',');
  R.steps++;
  if(sel===truth){
    award(true,3);
    if(R.g.out[curKey].length===0){ // dead state
      advanceMarking(`M${R.curIdx} is a dead state: no transition enabled.`);
    }else{
      R.phase='fire';R.fireAt=0;
      renderReach(`Enabled: ${truth||'none'}. Now fire them one by one.`);
    }
  }else{
    R.mistakes++;award(false,0);
    renderReach(`Not quite. ${R.net.type==='EC'?'E/C rule: ALL input places marked, output places free.':'P/T rule: every input place needs M(p) ≥ W(p,t), and every output place must still respect its capacity AFTER firing.'} Try again.`,true);
  }
}
function checkMarking(){
  const curKey=R.found[R.curIdx],e=R.g.out[curKey][R.fireAt];
  const {places}=netMaps(R.net);
  const raw=document.getElementById('mkin').value.split(',').map(s=>parseInt(s.trim(),10));
  const truth=R.g.markings[e.to];
  const okv=raw.length===places.length&&places.every((p,ix)=>raw[ix]===(truth[p]||0));
  R.steps++;
  if(okv){
    award(true,4);
    const known=R.found.indexOf(e.to);
    let msg;
    if(known===-1){R.found.push(e.to);msg=`${e.t} → new marking M${R.found.length-1}.`;}
    else msg=`${e.t} → M${known}: already in the table (that row is NOT explored again).`;
    R.fireAt++;
    if(R.fireAt>=R.g.out[curKey].length)advanceMarking(msg);
    else renderReach(msg);
  }else{
    R.mistakes++;award(false,0);
    renderReach(`Recompute: remove W(p,t) tokens from each input place of ${e.t}, add W(t,p) to each output place. Try again.`,true);
  }
}
function advanceMarking(msg){
  R.curIdx++;
  // next unexplored marking in table order
  if(R.curIdx<R.found.length){R.phase='enable';renderReach(msg+` Continue with M${R.curIdx}.`);}
  else{R.phase='final';buildFinals();renderReach(msg+' Table complete: now the analysis questions, exactly like the exam.');}
}
function buildFinals(){
  const net=R.net,g=R.g,lv=liveness(net),cls=netLivenessClass(net);
  const deadIdx=g.dead.map(k=>R.found.indexOf(k)).filter(i=>i>=0);
  R.finals=[
    {q:'Is the net bounded? For which k?',opts:[
      {t:'1-bounded (safe)',ok:g.bounded&&g.kbound===1},{t:'2-bounded',ok:g.bounded&&g.kbound===2},
      {t:'3-bounded',ok:g.bounded&&g.kbound===3},{t:'Unbounded',ok:!g.bounded}],
     why:`Scan the columns of your table: the maximum count in any single place is ${g.kbound}. In the exam, point at the line/column that shows it.`},
    {q:'Is the net live?',opts:[
      {t:'Yes: every transition is L4-live',ok:cls==='live'},
      {t:'No, but quasi-live: at least one transition is L4-live',ok:cls==='quasi'},
      {t:'No: no transition is L4-live'+(deadIdx.length?` (the table ends in dead state${deadIdx.length>1?'s':''} ${deadIdx.map(i=>'M'+i).join(', ')})`:''),ok:cls==='notlive'}],
     why:`Per-transition: ${net.trans.map(t=>t.id+': '+lv[t.id]).join(', ')}. ${deadIdx.length?'Rows without a firing transition ('+deadIdx.map(i=>'M'+i).join(', ')+') are dead states: after them nothing can fire.':''}`},
    ...net.trans.map(t=>({q:`Strict liveness of ${t.id}?`,opts:['L0','L1','L3','L4'].map(c=>({t:c+'-live',ok:lv[t.id]===c})),why:livWhy(lv[t.id],t.id)})),
    {q:'What type of Petri net is this?',opts:[
      {t:'E/C net: max 1 token per place, no weights/capacities',ok:net.type==='EC'},
      {t:'P/T net: edge weights and/or place capacities, places can hold several tokens',ok:net.type==='PT'}],
     why:net.type==='PT'?'It uses weights/capacities (see definition). P/T. Name both types + properties in the exam for full credit.':'No weights, no capacities, never more than one token per place. E/C. The other type (P/T) extends it with C and W.'},
  ];
  R.fi=0;
}
function finalQHtml(){
  const f=R.finals[R.fi];
  return `<div class="qmeta" style="margin-top:14px"><span>Analysis</span><span>${R.fi+1} / ${R.finals.length}</span></div>
    <div class="qtext">${f.q}</div>
    <div class="opts">${shuffle(f.opts.map((o,i)=>i)).map(oi=>`<button class="opt" data-oi="${oi}" onclick="reachFinalPick(this)"><span>${esc(f.opts[oi].t)}</span></button>`).join('')}</div>`;
}
function reachFinalPick(btn){
  const f=R.finals[R.fi],o=f.opts[+btn.dataset.oi];
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;const oo=f.opts[+b.dataset.oi];
    if(oo.ok)b.classList.add('right');else if(b===btn)b.classList.add('wrong');
  });
  award(!!o.ok,8);
  const st=modeStat('reach');st.seen++;if(o.ok)st.right++;save();
  const v=document.getElementById('verdict');
  const last=R.fi>=R.finals.length-1;
  v.innerHTML=`<div class="verdict ${o.ok?'ok':'bad'}"><div class="vh">${o.ok?'✓ Correct':'✗ Wrong'}</div><p>${f.why}</p></div>
    <div class="btnrow"><button class="btn" id="nextbtn" onclick="${last?'reachDone()':'R.fi++;renderReach()'}">${last?'Results →':'Next →'}</button></div>`;
  document.getElementById('nextbtn').focus();
}
function reachDone(){
  const acc=R.steps?Math.max(0,Math.round(100*(R.steps-R.mistakes)/R.steps)):100;
  const next=R.li+1<REACH_LEVELS.length;
  SCREEN.innerHTML=`<div class="card" style="text-align:center">
    <div class="qmeta" style="justify-content:center"><span>${R.lv.name}: cleared</span></div>
    <div class="bigscore">${R.found.length} markings</div>
    <p class="sub" style="margin:0 auto 10px">Table built with ${R.mistakes===0?'zero mistakes. Exam grade material.':R.mistakes+' correction'+(R.mistakes>1?'s':'')+' along the way ('+acc+'% first try). In the exam a wrong row also costs the follow-up points, so rerun this until it is clean.'}</p>
    <div class="btnrow" style="justify-content:center">
      ${next?`<button class="btn" onclick="startReach(${R.li+1})">Next drill →</button>`:''}
      <button class="btn ghost" onclick="startReach(${R.li})">Repeat drill</button>
      <button class="btn ghost" onclick="go('home')">Overview</button>
    </div></div>`;
}
/* ============ BOSS: ENDTERM SIMULATION ============ */
let B={};
function startBoss(){
  const qs=[
    ...sample(TRANSLATE_BANK,3),
    ...sample(NET_QS||(NET_QS=buildNetQuestions()),2),
    ...sample(CPEE_BANK,3),
    ...sample(BLITZ_BANK,4),
  ];
  B={qs:shuffle(qs),i:0,answers:[],t:18*60,timer:null,over:false};

    if(B.t<=0)bossEnd();
  },1000);
  renderBossQ();
}
function fmtT(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderBossQ(){
  if(B.i>=B.qs.length)return bossEnd();
  const q=B.qs[B.i];
  let h=`<div class="card">
    <div class="qmeta"><span>Endterm simulation</span><span><span id="timer">${fmtT(B.t)}</span> · ${B.i+1} / ${B.qs.length}</span></div>
    <div class="qtext">${q.q}</div>${qBlocks(q)}`;
  if(q.type==='text'){
    h+=`<div class="tin"><input id="tanswer" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')bossSubmit()"><button class="btn" onclick="bossSubmit()">Lock in</button></div>`;
  }else{
    const order=shuffle(q.opts.map((_,ix)=>ix));
    h+=`<div class="opts">`+order.map((oi,vi)=>{
      const o=q.opts[oi],inner=o.code?`<pre>${esc(o.code)}</pre>`:(o.svgOpt?`<span style="display:block;min-width:0"><span style="display:block;font-size:13.5px;font-weight:600;margin-bottom:4px">${esc(o.t)}</span><span style="display:block;overflow-x:auto">${o.svgOpt}</span></span>`:esc(o.t));
      return `<button class="opt" id="opt${vi}" data-oi="${oi}" onclick="${q.type==='mc'?`bossPick(${vi})`:`this.classList.toggle('sel')`}"><span class="key">${vi+1}</span><span style="min-width:0">${inner}</span></button>`;
    }).join('')+`</div>`;
    if(q.type==='multi')h+=`<div class="btnrow"><button class="btn" onclick="bossSubmit()">Lock in selection</button></div>`;
  }
  h+=`</div><div class="btnrow"><button class="btn ghost" onclick="bossEnd()">Hand in early</button></div>`;
  SCREEN.innerHTML=h;
  const inp=document.getElementById('tanswer');if(inp)inp.focus();
}
function bossPick(vi){
  const q=B.qs[B.i],o=q.opts[+document.getElementById('opt'+vi).dataset.oi];
  B.answers.push({q,ok:!!o.ok});B.i++;renderBossQ();
}
function bossSubmit(){
  const q=B.qs[B.i];let ok;
  if(q.type==='text')ok=norm(document.getElementById('tanswer').value)===norm(q.answer);
  else{
    ok=true;
    document.querySelectorAll('.opt').forEach(b=>{
      const o=q.opts[+b.dataset.oi];if(b.classList.contains('sel')!==!!o.ok)ok=false;
    });
  }
  B.answers.push({q,ok});B.i++;renderBossQ();
}
function bossEnd(){
  if(B.over)return;B.over=true;clearInterval(B.timer);
  const n=B.answers.length,right=B.answers.filter(a=>a.ok).length;
  const pct=B.qs.length?Math.round(100*right/B.qs.length):0;
  const grade=pct>=90?'1.0':pct>=82?'1.3':pct>=75?'1.7':pct>=67?'2.0':pct>=60?'2.3':pct>=55?'2.7':pct>=50?'3.0':pct>=45?'3.3':pct>=40?'3.7':pct>=35?'4.0':'5.0';
  S.boss=Math.max(S.boss||0,pct);S.xp+=right*6;save();rail();
  let h=`<div class="card" style="text-align:center">
    <div class="qmeta" style="justify-content:center"><span>Endterm simulation: result</span></div>
    <div class="bigscore">${right} / ${B.qs.length}</div>
    <p class="sub" style="margin:0 auto">≈ TUM grade <b>${grade}</b>${grade==='5.0'?': durchgefallen. Back to training.':grade<='1.7'?': sehr gut. Keep it sharp.':''} · unanswered count as wrong · best so far: ${S.boss}%</p>
    <div class="btnrow" style="justify-content:center;margin-bottom:6px">
      <button class="btn" onclick="go('boss')">Retake</button>
      <button class="btn ghost" onclick="go('home')">Overview</button>
    </div></div>
    <div class="eyebrow">Review</div>`;
  B.answers.forEach((a,ix)=>{
    h+=`<div class="card" style="margin-top:10px">
      <div class="qmeta"><span style="color:${a.ok?'var(--ok)':'var(--bad)'}">${a.ok?'✓':'✗'} Question ${ix+1}</span></div>
      <div class="qtext" style="font-size:15px">${a.q.q}</div>
      ${a.q.svg?`<div class="diagram">${a.q.svg}</div>`:''}
      <p class="qnote">${a.q.why||''}</p></div>`;
  });
  SCREEN.innerHTML=h;window.scrollTo(0,0);
}

/* ============ CHEAT SHEET ============ */
function renderManual(){
  SCREEN.innerHTML=`
  <h1>Cheat Sheet</h1>
  <p class="sub">Compiled from the 2026 lecture slides and the official exam instruction sheets, not from uploaded solution sheets. Still: if anything here contradicts your lecture materials, the lecture wins.</p>
  <div class="card manual">
    <h3>Pseudo code rules (Problem 1)</h3>
    <ul>
      <li>Allowed instructions only: <code>if / else if / else / end</code>, <code>while … end</code>, <code>task LABEL</code>, <code>parallel / branch / end</code>, <code>mutex … end</code> (only inside parallel branches), <code>set VAR = VALUE</code>, <code>deadlock</code>.</li>
      <li><b>If no condition of a decision is valid, a deadlock occurs: model it explicitly</b> (an <code>else deadlock</code>), unless the BPMN has a default (else) flow.</li>
      <li>Conditions like C1 are expressions, not variables: <b>never</b> <code>set</code> them. They can change whenever a task executes → for inclusive ORs, <b>latch conditions into variables first</b>, then execute branches.</li>
      <li>Shared flags in parallel branches need <code>mutex</code> around test-and-set: otherwise race condition.</li>
      <li>Only traces the BPMN describes may be possible: check loop type (pre-test vs post-test) by <b>where the back-edge re-enters</b> relative to the condition gateway.</li>
      <li>Not well-formed model? Restructure to a trace-equivalent block-structured model first.</li>
    </ul>
    <h3>Petri net firing rules</h3>
    <ul>
      <li><b>E/C net</b> N=(P,T,F): t enabled ⇔ all input places carry a token AND output places are free. Max 1 token per place.</li>
      <li><b>P/T net</b> N=(P,T,F,C,W,M0), Def 2.5: t activated under M ⇔ ∀p∈•t: M(p) ≥ W(p,t) and ∀ output place: tokens after firing ≤ C(p). Defaults: W=1, C=∞.</li>
      <li>Trap: W(p,t) &gt; C(p) for the same place ⇒ t can <b>never</b> fire (L0).</li>
      <li>Places and transitions always alternate; use silent (τ) transitions to keep it that way.</li>
      <li>XOR split = place with several output transitions (non-determinism). AND split = transition with several output places.</li>
    </ul>
    <h3>Analysis vocabulary (Problems 2–3)</h3>
    <table>
      <tr><th>Term</th><th>Meaning</th></tr>
      <tr><td>k-bounded</td><td>max k tokens in <b>each single place</b>, over all reachable markings. 1-bounded = safe. Judged per place, not per net.</td></tr>
      <tr><td>L0-live</td><td>t can never fire</td></tr>
      <tr><td>L1-live</td><td>t can fire at least once: finitely, determined from the start</td></tr>
      <tr><td>L2-live</td><td>finite but not determined how often (rare; hardly exam-relevant)</td></tr>
      <tr><td>L3-live</td><td>t CAN fire infinitely often for some sequence (loop with exit)</td></tr>
      <tr><td>L4-live</td><td>t can always fire again from every reachable marking</td></tr>
      <tr><td>live / strong-live</td><td>ALL transitions L4</td></tr>
      <tr><td>quasi-live / weak-live</td><td>at least one L4, plus lower-live ones (mutually exclusive with live)</td></tr>
      <tr><td>deadlock / dead state</td><td>reachable marking, no transition enabled: a row with no successor in the table</td></tr>
      <tr><td>home state</td><td>reachable from every reachable marking</td></tr>
      <tr><td>structurally sound</td><td>∃ initial node (no incoming), ∃ final node (no outgoing), every node on a path between them: <b>markings ignored</b></td></tr>
      <tr><td>Soundness P1–P4</td><td>P1 termination · P2 proper termination (no leftover tokens ⇒ bounded) · P3 no dead transitions · P4 participation (P1∧P3 ⇒ P4)</td></tr>
    </table>
    <h3>Reachability analysis method</h3>
    <ul>
      <li>One row per marking M0…Mn: token count per place + “firing transition” column (<code>t2 → M3</code>).</li>
      <li>Explore <b>every</b> enabled transition of every new marking. Already-known result ⇒ reference it (<code>t1 → M2</code>), don’t re-explore.</li>
      <li>Rows without successors = dead states. Max column value = boundedness. Cite rows/columns as evidence in your answers.</li>
    </ul>
    <h3>CPEE trees (Problem 4)</h3>
    <ul>
      <li>Ordered XML tree, depth-first execution; edges implicit ⇒ structural deadlocks impossible (behavioral still possible).</li>
      <li><b>Leaves:</b> Activity <code>&lt;call&gt;</code>, Script <code>&lt;manipulate&gt;</code>, Terminate, Stop, Escape. <b>Branches:</b> Choose, Alternative, Otherwise, Parallel, Parallel Branch.</li>
      <li><code>&lt;loop mode="pre_test|post_test"&gt;</code>: condition before vs after each iteration. post_test with false condition still runs once.</li>
      <li><code>&lt;choose mode="exclusive|inclusive"&gt;</code>: children evaluated in document order. Inclusive: every true alternative runs (in order!); otherwise only if none matched; missing otherwise = assumed empty.</li>
      <li><code>&lt;parallel wait="-1|n" cancel="…"&gt;</code>: wait for all / n branches. <code>wait="1" cancel="first"</code> = event-based gateway.</li>
      <li><code>escape</code> = jump out of nearest loop; <code>terminate</code> = final; <code>stop</code> = pausable. Ids (interruption points) only on activity, script, stop.</li>
      <li>Trace tasks: write explicit sequences (ABCDEB…), not *-notation, when iterations are fixed by data conditions.</li>
    </ul>
    <h3>Logs & lifecycles (Problem 4 theory)</h3>
    <ul>
      <li>Log item minimum: event/task name · timestamp · instance · lifecycle info. XES: log → trace (one per instance) → event.</li>
      <li>Appendable text formats (CSV/YAML/plain) = fastest logging; XML/JSON = bad IO.</li>
      <li>Logging = after-the-fact analysis; monitoring = runtime event streams.</li>
      <li>Instance lifecycle: ready → running → stopping → stopped → … → finished. Task: calling → receiving → manipulating → done/failed. </li>
      <li>Worklist = control + handling; pull = outdated lists, push = too chatty, best compromise = time-driven push. Roles make people exchangeable.</li>
      <li>Process management system: designers + participants (stakeholders); modeling GUI, model repository, engine, worklist, invoked applications (components).</li>
    </ul>
  </div>
  <div class="btnrow"><button class="btn" onclick="go('home')">Back to overview</button></div>`;
}

/* ============ HOME ============ */
function meterSvg(frac){
  let s='<svg width="110" height="18" viewBox="0 0 110 18">';
  const filled=Math.round(frac*5);
  for(let i=0;i<5;i++){
    const x=11+i*22;
    s+=`<circle cx="${x}" cy="9" r="7.5" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
    if(i<filled)s+=`<circle cx="${x}" cy="9" r="3.5" fill="var(--tok)"/>`;
  }
  return s+'</svg>';
}
function mastery(id,target){
  const st=S.modes[id];if(!st||!st.seen)return {frac:0,label:'untouched'};
  const frac=Math.min(1,st.right/target);
  return {frac,label:`${st.right} hits · ${Math.round(100*st.right/st.seen)}% accuracy`};
}
function renderHome(){
  const ops=[
    {id:'translate',n:'OP·01',target:14,go:"startMission('translate')"},
    {id:'nets',n:'OP·02',target:12,go:"startMission('nets')"},
    {id:'reach',n:'OP·03',target:20,go:"go('reach',0)",title:'Reachability Lab',sub:'Problem 3 · build the table, fire by fire · ≈24 credits: incl. the REAL 2022 & SS23 exam nets'},
    {id:'cpee',n:'OP·04',target:12,go:"startMission('cpee')"},
    {id:'blitz',n:'OP·05',target:16,go:"startMission('blitz')"},
  ];
  let h=`<h1>Pick a drill.</h1>
  <p class="sub">Four problems, 90 credits, 90 minutes. That is the exam. Petri net answers are computed live from the formal firing rules, and the reachability drills include real past-exam nets. Start where the credits are: translation and reachability together are half the exam.</p>
  <div class="card" style="border-color:var(--accent);margin:0 0 18px">
    <div class="qmeta"><span style="color:var(--accent)">⚠ Read this first</span></div>
    <p style="margin:8px 0 0;font-size:14px;max-width:70ch">This is an unofficial personal study project. It is <b>not associated with the TUM lecture, the chair, or any official material</b>. Your lecture notes are the top priority and the ground truth. This game helped me prepare and might help you too, but take it with a grain of salt: despite careful checking, some content may be wrong. Whenever something here contradicts the lecture, trust the lecture.</p>
  </div>
  <div class="ops">`;
  for(const o of ops){
    const cfg=MODES[o.id]||{};
    const m=mastery(o.id,o.target);
    h+=`<div class="op" tabindex="0" role="button" onclick="${o.go}" onkeydown="if(event.key==='Enter')this.click()">
      <div class="num">${o.n}</div>
      <div class="body">
        <div class="t">${o.title||cfg.title}</div>
        <div class="d">${o.sub||cfg.sub}</div>
        <div class="meter">${meterSvg(m.frac)}<span class="pct">${m.label}</span></div>
      </div></div>`;
  }
  h+=`<div class="op boss" tabindex="0" role="button" onclick="go('boss')" onkeydown="if(event.key==='Enter')this.click()">
      <div class="num">BOSS</div>
      <div class="body">
        <div class="t">Endterm Simulation</div>
        <div class="d">12 mixed questions · 18-minute timer · no feedback until you hand in${S.boss?` · best: ${S.boss}%`:''}</div>
      </div></div>
  </div>
  <div class="btnrow">
    <button class="btn ghost" onclick="go('manual')">📖 Cheat sheet: every definition in one place</button>
    <button class="btn ghost" onclick="if(confirm('Reset all progress?')){localStorage.removeItem(SAVE_KEY);S=load();rail();go('home')}">Reset progress</button>
  </div>
  <p class="footnote">Question style and topic weighting follow past BPTM exams and the SS24 topics protocol (workflow/WSM nets and process mining excluded there; verify nothing changed for your term). Definitions follow the 2026 lecture slides. Progress is saved in your browser only.</p>
  <div class="credits">
    <span class="who">Built by <b>Devansh Devrani</b>: a fellow BPTM student.</span>
    <a class="clink" href="https://www.linkedin.com/in/devansh-devrani/" target="_blank" rel="noopener">in · LinkedIn</a>
    <a class="clink coffee" href="https://buymeacoffee.com/devanshdevrani31" target="_blank" rel="noopener">☕ Buy me a coffee</a>
  </div>`;
  SCREEN.innerHTML=h;
}

<script>
/* ---------------------------------------------------------------------------
   UniDojo host adapter. Added on import; the game above is otherwise unchanged.
   Protocol: docs/02-game-contract.md

   Note: the frame is sandboxed without allow-modals, so alert()/confirm() calls
   in the game are ignored by the browser and their actions simply don't happen.
   That is deliberate — a modal from inside a game blocks the whole page.
   --------------------------------------------------------------------------- */
(function () {
  'use strict';
  var V = 1;
  function post(type, payload) {
    if (parent !== window) parent.postMessage({ v: V, type: type, payload: payload }, '*');
  }
  /** Run `after` once the named global function has done its work. */
  function wrap(name, after) {
    var orig = window[name];
    if (typeof orig !== 'function') return;
    window[name] = function () {
      var r = orig.apply(this, arguments);
      try { after(); } catch (e) {}
      return r;
    };
  }

  // The trainer already tracks its own results; wrap the two places a run ends so the
  // host learns the score, without changing how any of it behaves.
  wrap('renderQ', function () {
    if (typeof M === 'object' && M && M.qs && M.qs.length) {
      post('progress', { done: Math.min(M.i, M.qs.length), total: M.qs.length });
    }
  });
  wrap('missionEnd', function () {
    if (typeof M !== 'object' || !M || !M.qs || !M.qs.length) return;
    post('complete', {
      score: Math.round((100 * M.right) / M.qs.length), max: 100, durationMs: 0,
      breakdown: { correct: M.right, total: M.qs.length, drill: M.mode },
    });
  });
  // bossEnd() guards itself with B.over and returns early on a second call, so check
  // that flag BEFORE the original runs or we'd report the same result twice.
  (function () {
    var orig = window.bossEnd;
    if (typeof orig !== 'function') return;
    window.bossEnd = function () {
      var already = typeof B === 'object' && B && B.over;
      var r = orig.apply(this, arguments);
      if (!already) {
        try {
          var right = B.answers.filter(function (a) { return a.ok; }).length;
          post('complete', {
            score: Math.round((100 * right) / B.qs.length), max: 100,
            durationMs: (18 * 60 - B.t) * 1000,
            breakdown: { correct: right, total: B.qs.length, mode: 'endterm' },
          });
        } catch (e) {}
      }
      return r;
    };
  })();
  // These trainers run their own modes, so 'init' carries nothing they need — they are
  // already on screen. Answering it is what tells the host we're alive.
  addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.v !== V || d.type !== 'init') return;
  });
  post('ready');
})();
</script>
